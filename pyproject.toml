[project]
name = "satyrn-evals"
version = "0.1.0"
description = "Captures a Python-development task, invokes an attempt command, preserves what happened, and grades the result offline"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
satyrn-evals = "satyrn_evals.cli:main"
satyrn-evals-session-pi = "satyrn_evals.adapters.pi_session:main"
# The Baseline arm's attempt adapter (arms/baseline.json names this).
satyrn-evals-attempt-pi = "satyrn_evals.attempt_pi:main"
# HP7's real implementer, behind HP2's executable seam (route.command_implementer).
satyrn-evals-implementer-pi = "satyrn_evals.adapters.pi_implementer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn_evals"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.8",
    "pyrefly>=1.1.1",
]
docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.8.25",
]
# Integration tier only: the bundled local-pings task's base is the svcs
# checkout, whose root conftest.py imports sybil unconditionally and whose
# runtime needs attrs; pytest-asyncio serves svcs's async suite during
# capture's full-suite oracle. The default tier must never need these --
# the evidence floor's tests are marked integration and do not run in CI.
integration = [
    "attrs>=21.3.0",  # svcs runtime dependency
    "sybil>=6",       # svcs root conftest: from sybil import Sybil
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# docs/_build is the docs build output, never project tests.
norecursedirs = [
    "docs/_build",
    "src/satyrn_evals/tasks",
    ".worktrees",
    "tests/data",
    "tests/integration/data",
]
addopts = ["-m", "not integration", "--strict-markers"]
strict_xfail = true
markers = [
    "integration: needs the real clone cache or network; excluded from the offline unit run",
]

[tool.ruff]
# docs/ is the research record, not project source. Its markdown embeds
# Python quoted as it was *proposed* in a plan or *recorded* in a result;
# `ruff format` rewrites those code blocks, which silently edits history
# this project deliberately preserves.
# src/satyrn_evals/tasks/ is oracle fixture data: bundled tasks carry a
# foreign starting tree (e.g. the svcs checkout) that is neither project
# code nor ours to reformat. pytest and pyrefly already exclude it.
extend-exclude = ["docs", "src/satyrn_evals/tasks"]

[tool.ruff.lint]
# Proportionate, not maximalist: correctness and clarity rules a
# 5-h/wk contributor benefits from, without a style debate.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade -- keeps us on modern syntax for the pinned version
    "B",    # bugbear
    "SIM",  # simplify
]
# Line length is the one rule we decline. Several tests carry literal
# fixture content and contract strings where a wrap would hurt readability
# rather than help it.
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# src/satyrn_evals/tasks is oracle fixture data, not project code: its
# base tests import a bare module name the type checker cannot resolve.
# The tests/**/data trees are the same shape: vendored fixture bases and
# grader overlays importing bare module names, not project code.
project-excludes = ["src/satyrn_evals/tasks", "tests/data", "tests/integration/data"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["satyrn_evals"]

[tool.coverage.report]
fail_under = 100
show_missing = true
